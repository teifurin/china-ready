<!doctype html>
<html lang="en" data-mode="static">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>China Ready · 入境中国随身通</title>
<meta name="theme-color" content="#f5f5f2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./"><img src="icon.svg" alt="" width="30" height="30"><span><b>China Ready</b><small lang="zh-CN">入境中国随身通</small></span></a>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<div id="error" class="banner error" role="alert" hidden></div>

<main>
  <section class="hero">
    <h1 data-i="heroTitle"></h1>
    <p class="lede" data-i="heroSub"></p>
    <div class="ask">
      <textarea id="q" rows="3" maxlength="2000"></textarea>
      <div class="budget" id="budget" role="group" aria-labelledby="budget-label"></div>
      <div class="ask-bar">
        <div class="chips" id="examples"></div>
        <button id="go" class="btn primary" type="button"><span data-i="go"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </section>

  <section id="chooser" class="chooser" hidden></section>

  <section id="progress" class="progress" hidden>
    <div class="progress-head"><span class="spinner"></span><b data-i="working"></b><span class="count" id="pcount"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <ul id="steps"></ul>
  </section>

  <section id="result" hidden>
    <div id="trip"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="tab-plan" class="tab"></div>
    <div id="tab-cards" class="tab" hidden></div>
    <div id="tab-photo" class="tab" hidden></div>
    <div id="tab-tips" class="tab" hidden></div>
  </section>
</main>

<footer class="foot">
  <div class="foot-in">
    <div id="sources"></div>
    <p class="attrib">Based on fly.ai real-time results · 飞猪 Fliggy flyai × 阿里云百炼 Qwen</p>
  </div>
</footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="sheet-top">
      <span id="m-title"></span>
      <div class="sheet-actions">
        <button class="btn ghost" id="m-rot" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg><span data-i="flip"></span></button>
        <button class="btn ghost" id="m-save" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg><span data-i="saveImg"></span></button>
        <button class="btn ghost" id="m-close" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i="close"></span></button>
      </div>
    </div>
    <div class="zh" id="m-zh" lang="zh-CN"></div>
    <div class="gloss" id="m-gloss"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
